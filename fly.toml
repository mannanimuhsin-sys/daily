app = "islamic-daily-tracker"
primary_region = "sin"  # Singapore — India-ൽ നിന്ന് closest

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent Volume for SQLite data
[[mounts]]
  source = "sqlite_data"
  destination = "/data"
